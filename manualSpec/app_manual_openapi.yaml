openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
  description: Manually separated OpenAPI specification based on the original Flasgger docstrings.
paths:
  /api/todos:
    get:
      summary: Get all todos
      operationId: api_get_todos
      responses:
        '200':
          description: List of todo items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      summary: Create a new todo
      operationId: api_create_todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/todos/{todo_id}:
    get:
      summary: Get todo by ID
      operationId: api_get_todo
      parameters:
        - name: todo_id
          in: path
          required: true
          description: ID of the todo item
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: A todo item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
    put:
      summary: Update a todo by ID
      operationId: api_update_todo
      parameters:
        - name: todo_id
          in: path
          required: true
          description: ID of the todo to update
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: Updated todo item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Todo not found
    delete:
      summary: Delete a todo by ID
      operationId: api_delete_todo
      parameters:
        - name: todo_id
          in: path
          required: true
          description: ID of the todo to delete
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTodoResponse'
        '404':
          description: Todo not found
components:
  schemas:
    Todo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Buy groceries
        complete:
          type: boolean
          example: false
    CreateTodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: New task
    UpdateTodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Updated task
        complete:
          type: boolean
          example: true
    DeleteTodoResponse:
      type: object
      properties:
        result:
          type: boolean
          example: true
    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid input
