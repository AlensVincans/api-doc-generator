openapi: 3.0.0
info:
  title: Colors API
  version: 1.0.0
paths:
  /colors/{palette}/:
    get:
      tags:
        - colors
      summary: Example endpoint return a list of colors by palette
      operationId: get_colors
      deprecated: false
      externalDocs:
        description: Project repository
        url: http://github.com/rochacbruno/flasgger
      parameters:
        - name: palette
          in: path
          description: Which palette to filter?
          required: true
          schema:
            type: string
            enum:
              - all
              - rgb
              - cmyk
            default: all
      responses:
        '200':
          description: A list of colors (may be filtered by palette)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Palette'
              examples:
                rgb:
                  value:
                    - red
                    - green
                    - blue
      security:
        - colors_auth:
            - write:colors
            - read:colors
components:
  schemas:
    Palette:
      type: object
      properties:
        palette_name:
          type: array
          items:
            $ref: '#/components/schemas/Color'
    Color:
      type: string
  securitySchemes:
    colors_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://example.com/oauth/authorize
          scopes:
            write:colors: write colors
            read:colors: read colors
