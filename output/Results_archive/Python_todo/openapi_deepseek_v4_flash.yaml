openapi: '3.0.0'
info:
  title: Todo API
  version: 1.0.0
paths:
  /api/v1/todos:
    get:
      operationId: listEntries
      responses: {}
  /api/v1/todo/{id}:
    get:
      operationId: getEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses: {}
    put:
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses: {}
    patch:
      operationId: patch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created
    delete:
      operationId: delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /api/v1/todo:
    post:
      operationId: create
      responses: {}