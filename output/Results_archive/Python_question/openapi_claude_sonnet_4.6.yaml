openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
paths:
  /question/{qid}:
    get:
      operationId: get_question
      summary: Get a question by ID
      parameters:
        - name: qid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /question/{qid}/knowledge:
    get:
      operationId: get_question_knowledge
      summary: Get knowledge associated with a question
      parameters:
        - name: qid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /question/list:
    get:
      operationId: list_questions
      summary: List all questions
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /knowledge/questions:
    get:
      operationId: get_question_by_knowledge
      summary: Get questions by knowledge
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /knowledge/list:
    get:
      operationId: list_knowledge
      summary: List all knowledge
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object