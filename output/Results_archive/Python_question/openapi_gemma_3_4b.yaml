openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
paths:
  /question/{qid}:
    get:
      summary: Get a question by ID
      parameters:
        - in: path
          name: qid
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
        '404':
          description: Question not found
  /question/{qid}/knowledge:
    get:
      summary: Get knowledge related to a question
      parameters:
        - in: path
          name: qid
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
        '404':
          description: Question not found
  /question/list:
    get:
      summary: List questions
      parameters:
        - in: path
          name: qid
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
  /knowledge/questions:
    get:
      summary: List questions by knowledge
      parameters:
        - in: path
          name: qid
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
  /knowledge/list:
    get:
      summary: List knowledge
      parameters:
        - in: path
          name: qid
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response